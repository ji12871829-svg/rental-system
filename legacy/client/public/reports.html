<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMS — Reports</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Rental&nbsp;MS</div>
      <nav>
        <a href="dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="units.html" data-page="units">Units</a>
        <a href="tenants.html" data-page="tenants">Tenants</a>
        <a href="leases.html" data-page="leases">Leases</a>
        <a href="payments.html" data-page="payments">Payments</a>
        <a href="maintenance.html" data-page="maintenance">Maintenance</a>
        <a href="reports.html" data-page="reports">Reports</a>
        <a href="users.html" data-page="users" class="admin-only">Users</a>
        <div class="spacer"></div>
        <a href="#" id="logout-link" class="logout">Logout</a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar"></header>
      <main class="content">
        <div class="page-header">
          <h1>Reports</h1>
          <div class="toolbar" style="margin:0;">
            <select id="month-select"></select>
            <select id="year-select"></select>
            <button class="btn" id="refresh-btn">Refresh</button>
          </div>
        </div>

        <div class="reports-grid">
          <section class="card">
            <h2>Occupancy — <span id="occupancy-period"></span></h2>
            <div class="stat-cards" style="margin-bottom:0;">
              <div class="stat-card"><div class="label">Occupancy Rate</div><div class="value" id="occ-rate">—</div></div>
              <div class="stat-card"><div class="label">Occupied</div><div class="value" id="occ-occupied">—</div></div>
              <div class="stat-card"><div class="label">Vacant</div><div class="value" id="occ-vacant">—</div></div>
              <div class="stat-card"><div class="label">Maintenance</div><div class="value" id="occ-maint">—</div></div>
            </div>
          </section>

          <section class="card">
            <h2>Rent Collection — <span id="rent-period"></span></h2>
            <canvas id="rent-chart" class="chart"></canvas>
            <div style="display:flex; justify-content:space-between; margin-top:0.75rem; font-size:0.85rem;">
              <span>Billed: <strong id="rent-billed">—</strong></span>
              <span>Collected: <strong id="rent-collected">—</strong></span>
              <span>Outstanding: <strong id="rent-outstanding">—</strong></span>
              <span>Rate: <strong id="rent-rate">—</strong></span>
            </div>
          </section>
        </div>

        <div class="card mt-2" style="margin-top:1.25rem;">
          <h2>Per-Unit Collection — <span id="byunit-period"></span></h2>
          <table class="data">
            <thead><tr><th>Unit</th><th>Billed</th><th>Collected</th><th>Outstanding</th></tr></thead>
            <tbody id="byunit-body"><tr><td colspan="4" class="empty-state">Select a month.</td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/reports.js"></script>
</body>
</html>
