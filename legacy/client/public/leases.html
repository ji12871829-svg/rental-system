<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMS — Leases</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Rental&nbsp;MS</div>
      <nav>
        <a href="dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="units.html" data-page="units">Units</a>
        <a href="tenants.html" data-page="tenants">Tenants</a>
        <a href="leases.html" data-page="leases">Leases</a>
        <a href="payments.html" data-page="payments">Payments</a>
        <a href="maintenance.html" data-page="maintenance">Maintenance</a>
        <a href="reports.html" data-page="reports">Reports</a>
        <a href="users.html" data-page="users" class="admin-only">Users</a>
        <div class="spacer"></div>
        <a href="#" id="logout-link" class="logout">Logout</a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar"></header>
      <main class="content">
        <div class="page-header">
          <h1>Leases</h1>
          <button class="btn" id="create-lease-btn">+ Create Lease</button>
        </div>
        <div class="tabs" id="lease-tabs">
          <button data-status="active" class="active">Active</button>
          <button data-status="expired">Expired</button>
          <button data-status="terminated">Terminated</button>
        </div>
        <table class="data">
          <thead><tr><th>Unit</th><th>Tenant</th><th>Start</th><th>End</th><th>Rent/Mo</th><th>Status</th><th style="width:160px">Action</th></tr></thead>
          <tbody id="leases-body"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/leases.js"></script>
</body>
</html>
