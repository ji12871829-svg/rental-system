<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMS — Login</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-box">
    <h1>Rental Management System</h1>
    <p class="sub">Single-building management — sign in to continue</p>
    <div id="error-banner" class="alert error hidden"></div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn" id="login-btn">Log In</button>
    </form>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
