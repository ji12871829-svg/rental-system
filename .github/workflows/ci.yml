# CI — runs on every push and PR. Backend integration tests need PostgreSQL:
# the service container uses the exact credentials globalSetup.ts expects
# (postgres://rms_user:rms_password@localhost:5432/rpms), so no test-code
# changes are required for CI.
name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rms_user
          POSTGRES_PASSWORD: rms_password
          POSTGRES_DB: rpms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rms_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vite build
