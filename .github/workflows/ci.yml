# CI — runs on every push and PR, plus a weekly security sweep. Backend
# integration tests need PostgreSQL: the service container uses the exact
# credentials globalSetup.ts expects
# (postgres://rms_user:rms_password@localhost:5432/rpms), so no test-code
# changes are required for CI.
name: CI

on:
  push:
  pull_request:
  # Weekly security sweep (Mondays 06:00 UTC / 09:00 Nairobi): the
  # secrets-scan and dependency-audit jobs below also run on this schedule,
  # so newly-published advisories or newly-detected leaks fail CI even when
  # nothing has been pushed. The push/PR-only jobs skip via their `if`
  # guards (verify-live follows the needs chain). GitHub may delay scheduled
  # runs during peak load, and auto-disables scheduled workflows after 60
  # days of repo inactivity — a no-op commit re-enables them.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  backend:
    if: github.event_name != 'schedule' # weekly sweep runs only the security jobs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rms_user
          POSTGRES_PASSWORD: rms_password
          POSTGRES_DB: rpms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rms_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # matches local dev and Render's pinned NODE_VERSION (render.yaml)
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # matches local dev and Render's pinned NODE_VERSION (render.yaml)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vite build

  # Mirrors the Render build 1:1: NODE_ENV=production (Render's default, which
  # makes plain `npm ci` skip devDependencies) and the build command parsed
  # straight out of render.yaml, so CI fails exactly where Render would if the
  # two ever drift — e.g. a lost --include=dev turning `tsc -b` into a TS7016
  # storm. The jobs above keep testing dev mode; this one guards the deploy.
  render-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # matches local dev and Render's pinned NODE_VERSION (render.yaml)
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Execute render.yaml buildCommand under NODE_ENV=production
        run: |
          BUILD_CMD=$(python3 -c "import yaml; print(yaml.safe_load(open('render.yaml'))['services'][0]['buildCommand'])" 2>/dev/null \
            || grep '^    buildCommand:' render.yaml | sed 's/^ *buildCommand: *//')
          if [ -z "$BUILD_CMD" ]; then echo 'could not extract buildCommand from render.yaml' >&2; exit 1; fi
          echo "Render buildCommand: $BUILD_CMD"
          bash -c "$BUILD_CMD"
      # Cheap guard: the predeploy gate only warns when frontend/dist is
      # missing, but a same-origin deploy without it is still broken.
      - name: Assert frontend/dist/index.html was produced
        run: test -f frontend/dist/index.html

  # Post-deploy verification against the real Render service. Render does not
  # post deploy statuses to GitHub, so the job polls /api/health until the
  # service answers (instant when the deploy is already live), then runs the
  # full public-surface check suite. Authed checks are skipped until repo
  # secrets VERIFY_ADMIN_EMAIL / VERIFY_ADMIN_PASSWORD exist — add them (the
  # real admin credentials) and set VERIFY_SKIP_AUTH to '0' to enable them.
  # To repoint at a recreated service (e.g. the Frankfurt one), set the
  # RENDER_URL repository variable — same variable the keep-warm job uses.
  verify-live:
    # Explicit guard (would auto-skip via needs anyway): prod verification is
    # a deploy-time check, not part of the weekly sweep.
    if: github.event_name != 'schedule'
    needs: [backend, frontend, render-build]
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.RENDER_URL || 'https://rpms-gakt.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the service to answer (deploy already live → instant)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE_URL/api/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health 200 (attempt $i)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — deploy in progress or cold start; retrying in 15s"
            sleep 15
          done
          echo "service never returned 200 within 10 minutes" >&2
          exit 1
      - name: Verify live deployment
        env:
          VERIFY_SKIP_AUTH: '1'
        run: node scripts/verify-live.mjs "$BASE_URL"

  # Dead-code detector (knip): blocks on unused files, dependencies, exports
  # and exported types. The 41-item export backlog was triaged (removed or
  # un-exported; the two consumed via dynamic require() / inline import() casts
  # are annotated with @public JSDoc tags — search that tag before deleting an
  # "unused" export). The full report runs non-blocking to surface other
  # categories without gating CI on them.
  knip:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # matches local dev and Render's pinned NODE_VERSION
          cache: npm
          cache-dependency-path: package-lock.json
      # knip parses each workspace's sources, so every workspace's deps must
      # be resolvable — the repo is not an npm-workspaces monorepo, so install
      # all three explicitly (the root install alone hoists nothing).
      - run: npm ci --include=dev
      - run: npm ci --include=dev --prefix backend
      - run: npm ci --include=dev --prefix frontend
      - name: Block on unused files, dependencies, exports and types
        run: npx knip --include files,dependencies,exports,types
      - name: Full report (informational, non-blocking)
        run: npx knip
        continue-on-error: true

  # Secret scanner: blocks on credentials committed in any reachable commit.
  # Gitleaks is installed from its official GitHub release pinned by version
  # AND sha256 — the trust chain is checkout + curl + sha256sum, no
  # third-party Actions. A finding that is genuinely safe (e.g. a documented
  # test fixture) gets one line in .gitleaksignore with its fingerprint and a
  # comment saying who allowed it and why; everything else fails this job.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the scan covers every reachable commit
      - name: Install gitleaks (pinned version + sha256)
        run: |
          GITLEAKS_VERSION=8.18.4
          GITLEAKS_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --verbose

  # Dependency audit: blocks on known vulnerabilities in the PRODUCTION
  # dependency trees. Prod-only scope matches the deploy (Render builds with
  # NODE_ENV=production, so dev dependencies never ship — see render-build).
  # Runs against the committed lockfiles, so results are reproducible.
  # --audit-level=low means ANY advisory fails the build; if one is ever
  # assessed as not applicable, fix or pin deliberately rather than raising
  # the threshold — that decision belongs in review, not in a quieter gate.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # matches local dev and Render's pinned NODE_VERSION
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=low
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=low
