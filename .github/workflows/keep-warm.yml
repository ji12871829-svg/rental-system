# Keep-warm pinger — Render free-tier web services spin down after ~15 minutes
# without traffic, and the next request then waits ~30-60s for the instance to
# boot. Pinging /api/health every 10 minutes keeps the service (and the Neon
# database it touches) warm so users never hit a cold start.
#
# Bonus: a red X here means the live site failed its health check 3 times in a
# row — a crude but effective uptime alarm.
#
# Render plans: upgrade to any paid instance type and this file can be
# deleted (paid services never spin down).
name: Keep warm

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min — leaves margin vs the 15-min idle timer
  workflow_dispatch: # manual run button, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        # To cut over to a recreated service (e.g. the Frankfurt one), set the
        # repository variable RENDER_URL (repo Settings → Secrets and variables
        # → Actions → Variables → New repository variable) to e.g.
        # https://rpms-abcd1234.onrender.com — no commit needed. While unset,
        # the pinger keeps targeting the original Oregon service.
        env:
          TARGET_URL: ${{ vars.RENDER_URL || 'https://rpms-gakt.onrender.com' }}
        run: |
          URL="$TARGET_URL/api/health"
          echo "pinging $URL"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL")
            if [ "$code" = "200" ]; then
              echo "health OK (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code - retrying in 15s"
            sleep 15
          done
          echo "health check failed after 3 attempts"
          exit 1
