# Render Blueprint — one-click deploy of RPMS (API + built frontend in one
# service). Requires only a Neon project to exist (see docs/DEPLOY.md): create
# it, copy the POOLED connection string, then deploy this blueprint and paste
# it when prompted for DATABASE_URL. The schema, seed and default users are
# applied automatically on the first boot (src/db/bootstrap.ts) — no manual
# migration step.
#
# Deploy: push this repo to GitHub → Render Dashboard → New → Blueprint →
# select the repo → fill in the prompted variables.
services:
  - type: web
    name: rpms
    runtime: node
    plan: free
    # Region must match the DEPLOYED service (oregon). Render rejects region
    # changes on an existing service, so any other value makes every blueprint
    # sync fail ("changing region not supported") — which silently blocks
    # autoDeploy and env-var updates from ever applying (2026-10-14 outage of
    # the auto-deploy pipeline). Original goal was Frankfurt (co-locate with
    # Neon eu-central-1): to get there, recreate the service in Frankfurt and
    # change this line in the same PR.
    region: oregon
    # Build the frontend first (outputs frontend/dist), then compile the API.
    # --include=dev on BOTH installs: TypeScript must be installed to build (Render
    # defaults NODE_ENV=production, which would skip devDependencies otherwise).
    # Build shared/ first explicitly: its file: deps run `prepare` on install,
    # but a guaranteed pre-build keeps the type contract independent of the
    # installing npm version's prepare behavior.
    buildCommand: npm run build --prefix shared && cd frontend && npm ci --include=dev && npm run build && cd ../backend && NODE_ENV=development npm ci --include=dev && cd ../backend && npm run build
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    # Auto-deploy is enabled: every push to main and every pull request
    # runs the 8 required status checks (backend, frontend, lint, knip,
    # secrets-scan, dependency-audit, render-build, verify-live), and Render's
    # GitHub App will not build a commit while any of them is red. The CI
    # workflow already bails on failure — status checks are enforced and
    # unskipped, so autoDeploy: true is safe to rely on. Use the Render
    # dashboard 'Redeploy this commit' button only to re-promote a commit
    # whose checks were manually approved or to roll back a broken release.
    autoDeploy: true
    envVars:
      # Pin Node to the version used in local development (v26.3.0). Render
      # otherwise defaults to 24.14.1 for services created 2026-04-21+.
      # Precedence: NODE_VERSION > .node-version > .nvmrc > engines.
      - key: NODE_VERSION
        value: 26.3.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # pasted at deploy time — Neon pooled connection string (schema auto-applies on first boot)
      - key: JWT_SECRET
        generateValue: true # auto-generated once, kept across deploys
      - key: JWT_STAFF_SECRET
        generateValue: true # staff JWT signing key (≥32 chars, must differ from portal)
      - key: JWT_PORTAL_SECRET
        generateValue: true # portal JWT signing key (≥32 chars, must differ from staff)
      - key: SMS_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      # Set EMAIL_PROVIDER=brevo plus BREVO_API_KEY, EMAIL_FROM and
      # BREVO_TEST_RECIPIENTS in the Render dashboard for safe testing.
      # Daraja callback gate (security finding F2): without this token the
      # /api/mpesa/* callbacks accept unauthenticated POSTs and the production
      # boot log warns on every start. Prompted at blueprint-deploy time; a
      # 64-char hex from `openssl rand -hex 32` (docs/runbooks/RUNBOOK-mpesa-callback-gate.md).
      - key: MPESA_CALLBACK_TOKEN
        sync: false # paste a 64-hex token; then append ?token=<same> to the Daraja callback URLs
      # Same-origin deploy: Express serves frontend/dist, CORS never fires.
    # Add CORS_ORIGIN only if you later split the frontend to its own host.
