# Render Blueprint — one-click deploy of RPMS (API + built frontend in one
# service). Requires the Neon database to exist first (see docs/DEPLOY.md):
# create it, run the schema setup, then deploy this blueprint and paste the
# Neon POOLED connection string when prompted for DATABASE_URL.
#
# Deploy: push this repo to GitHub → Render Dashboard → New → Blueprint →
# select the repo → fill in the prompted variables.
services:
  - type: web
    name: rpms
    runtime: node
    plan: free
    # Build the frontend first (outputs frontend/dist), then compile the API.
    # --include=dev: TypeScript must be installed to build (Render defaults
    # NODE_ENV=production, which would skip devDependencies otherwise).
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci --include=dev && npm run build
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # pasted at deploy time — Neon pooled connection string
      - key: JWT_SECRET
        generateValue: true # auto-generated once, kept across deploys
      - key: SMS_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      # Same-origin deploy: Express serves frontend/dist, CORS never fires.
      # Add CORS_ORIGIN only if you later split the frontend to its own host.
